# Services for the Frappe dev container. Passwords come from .env in this
# directory, which init-env.sh generates on first start: `:?` rather than a
# default, so a missing .env stops the stack instead of quietly bringing up a
# database everyone's password opens.
#
# The project name applies to a plain `docker compose up`. DevPod overrides it
# with its own `--project-name`, whose hash changes between runs, so no service
# sets container_name (a new project would clash with the containers the last
# one left behind) and every volume below has a fixed name.
name: icrc-frappe

services:
  mariadb:
    image: docker.io/mariadb:11.8
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      # server_audit.so ships with the image, it just has to be loaded. The log
      # lives in the data dir, so it stays in the volume, and rotates so a
      # chatty development box cannot fill it.
      - --plugin-load-add=server_audit
      - --server-audit-logging=ON
      - --server-audit-events=CONNECT,QUERY,TABLE
      - --server-audit-output-type=file
      - --server-audit-file-path=/var/lib/mysql/server_audit.log
      - --server-audit-file-rotate-size=10485760
      - --server-audit-file-rotations=5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run .devcontainer/init-env.sh}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/redis:8.2-alpine

  redis-queue:
    image: docker.io/redis:8.2-alpine

  # Catches every mail the bench sends. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.2
    volumes:
      - mailpit-data:/data
    ports:
      - "8025:8025"
    expose:
      - 1025
      - 1110
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_POP3_BIND_ADDR: "0.0.0.0:1110"

  # S3-compatible object store, for apps that keep files outside the database.
  # s3.json is rendered from its template by init-env.sh with the same keys as
  # .env, which is why it is gitignored rather than committed.
  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -filer -filer.encryptVolumeData
    ports:
      - "9100:8333" # S3 API
      - "9101:9333" # master HTTP / web UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  frappe:
    build:
      context: .
      # Always fetch frappe/bench:latest before building. A cached copy keeps
      # its old pyenv and nvm, which do not know the FRAPPE_PYTHON and
      # FRAPPE_NODE a newer .env pins.
      pull: true
      args:
        # The default Python and Node of the bench, written to .env by
        # init-env.sh, the one place they are set.
        FRAPPE_PYTHON: ${FRAPPE_PYTHON:?run .devcontainer/init-env.sh}
        FRAPPE_NODE: ${FRAPPE_NODE:?run .devcontainer/init-env.sh}
    # Rootless Podman: keep the host UID so the bind-mounted workspace stays
    # writable. Harmless under Docker.
    userns_mode: keep-id
    command: sleep infinity
    environment:
      - SHELL=/bin/zsh
    working_dir: /workspace/development
    volumes:
      - ..:/workspace:z,cached
    ports:
      - "8000-8005:8000-8005"
      - "9000-9005:9000-9005"

  # Identity provider, for OIDC login against the `frappe` realm. `start-dev`
  # runs against the embedded database over plain HTTP: development only. The
  # realm is imported on first start from keycloak-realm.json, rendered by
  # init-env.sh with the client secret and the test user's password from .env;
  # an existing realm is left alone on later starts. Admin console on
  # http://localhost:8080, user admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:?run .devcontainer/init-env.sh}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-realm.json:/opt/keycloak/data/import/frappe-realm.json:ro

  # One OpenAI-compatible endpoint in front of whichever model providers
  # litellm-config.yaml lists. http://litellm:4000 from the bench. The provider
  # keys are the empty lines init-env.sh leaves in .env for you to fill in; the
  # config never holds one.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.7-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run .devcontainer/init-env.sh}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-}

# Named outright, so the data survives a change of project name; not external,
# so a clean machine needs no `docker volume create` before the first start.
# Compose warns when a later project picks one up; the warning is harmless.
volumes:
  mariadb-data:
    name: icrc-frappe_mariadb-data
  mailpit-data:
    name: icrc-frappe_mailpit-data
  seaweedfs-data:
    name: icrc-frappe_seaweedfs-data
  keycloak-data:
    name: icrc-frappe_keycloak-data
