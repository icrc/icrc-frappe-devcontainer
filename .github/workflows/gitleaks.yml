# Fails a pull request whose commits carry a secret. The same scan as the
# pre-commit hook, run where --no-verify cannot skip it. It blocks a merge only
# once "gitleaks" is a required status check in the branch ruleset.
#
# The gitleaks binary, not gitleaks/gitleaks-action, which needs a licence key
# on an organisation's repository. The version and digest are read from the
# Dockerfile, so the container and CI never scan with different releases.
# Docs: https://github.com/gitleaks/gitleaks#usage
name: gitleaks

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version="$(sed -n 's/^ARG GITLEAKS_VERSION=//p' .devcontainer/Dockerfile)"
          sha="$(sed -n 's/^ARG GITLEAKS_SHA256_AMD64=//p' .devcontainer/Dockerfile)"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"

      # Only the commits the pull request adds, so a finding is always one
      # its author can fix.
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
