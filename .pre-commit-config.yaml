# Hooks run on `git commit`, wired in by `pre-commit install` in
# postCreateCommand. gitleaks is the binary the Dockerfile installs, not the
# upstream hook, which would download a Go toolchain and build gitleaks on the
# first commit. .github/workflows/gitleaks.yml runs the same scan on every pull
# request, so a commit made with --no-verify is still caught.
# Docs: https://pre-commit.com/#repository-local-hooks
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
